<!doctype html><html><head><meta charset="utf-8"><title>Verifica layout TEST</title></head><body style="margin:0;background:#ddd;font-family:system-ui"><label>Larghezza <select id="width"><option>280</option><option selected>320</option><option>360</option><option>390</option><option>430</option><option>768</option><option>1024</option></select></label> <button id="large">Ingrandisci testi 150%</button> <button id="reset">Ricarica</button><p id="result"></p><iframe title="App TEST responsive" src="/" style="display:block;width:320px;height:760px;border:0;margin:12px auto;background:white"></iframe><script>
const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value+'px'};document.querySelector('#reset').onclick=()=>frame.contentWindow.location.reload();document.querySelector('#large').onclick=()=>{const doc=frame.contentDocument;const values=Array.from(doc.querySelectorAll('body *')).filter(e=>e.children.length===0||['INPUT','SELECT','BUTTON'].includes(e.tagName)).map(e=>[e,parseFloat(frame.contentWindow.getComputedStyle(e).fontSize)]);values.forEach(([e,size])=>e.style.fontSize=size*1.5+'px');document.querySelector('#result').textContent='Testi ingranditi al 150%';};
</script></body></html>
