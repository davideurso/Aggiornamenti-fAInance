workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore-connect

      node: latest
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.fainanceapp.app

      vars:
        BUNDLE_ID: "it.fainanceapp.app"
        APPLE_TEAM_ID: "SSV4P8694F"
        PROFILE_NAME: "fainance-appstore-profile"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.5.2"
        BUILD_NUMBER: "131"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS platform
        script: |
          CAP_VERSION=$(node -p "const p=require('./package.json'); const v=(p.dependencies && p.dependencies['@capacitor/core']) || (p.devDependencies && p.devDependencies['@capacitor/core']) || 'latest'; console.log(v)")
          npm install @capacitor/ios@$CAP_VERSION

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Inspect iOS folder
        script: |
          echo "Contenuto cartella ios:"
          find ios -maxdepth 5 -type f | sort
          echo "Contenuto ios/App:"
          ls -la ios/App || true

      - name: Install CocoaPods if Podfile exists
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd ../..
          elif [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "Nessun Podfile trovato. Continuo senza pod install."
          fi

      - name: Set iOS version and build number
        script: |
          cd ios/App

          if [ -f "App/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" App/Info.plist || true
          fi

          if [ -d "App.xcodeproj" ]; then
            xcrun agvtool new-marketing-version "$APP_VERSION" || true
            xcrun agvtool new-version -all "$BUILD_NUMBER" || true
          fi

          cd ../..

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Force Xcode signing settings
        script: |
          python3 - <<'PY'
          import os
          import re

          pbxproj = "ios/App/App.xcodeproj/project.pbxproj"
          bundle_id = os.environ["BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]

          with open(pbxproj, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r"PRODUCT_BUNDLE_IDENTIFIER = [^;]*;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
              text
          )

          build_settings_blocks = re.findall(r"buildSettings = \{[\s\S]*?\n\s*\};", text)

          for block in build_settings_blocks:
              new_block = block

              def set_or_add(setting, value):
                  nonlocal new_block
                  pattern = rf"{setting} = [^;]*;"
                  line = f"                {setting} = {value};"
                  if re.search(pattern, new_block):
                      new_block = re.sub(pattern, line.strip(), new_block)
                  else:
                      new_block = new_block.replace("buildSettings = {", "buildSettings = {\n" + line, 1)

              set_or_add("DEVELOPMENT_TEAM", team_id)
              set_or_add("CODE_SIGN_STYLE", "Manual")
              set_or_add("PROVISIONING_PROFILE_SPECIFIER", f'"{profile_name}"')
              set_or_add("PRODUCT_BUNDLE_IDENTIFIER", bundle_id)

              text = text.replace(block, new_block)

          with open(pbxproj, "w", encoding="utf-8") as f:
              f.write(text)

          print("Signing settings patched")
          PY

          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj | head -100

      - name: Build iOS IPA
        script: |
          echo "Uso project: $XCODE_PROJECT"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "DEVELOPMENT_TEAM=$APPLE_TEAM_ID PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - davideurso87@gmail.com
        notify:
          success: true
          failure: true
