workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS project
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build

    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - ios/App/build/Build/Products/**/*.ipa
      - ios/App/build/Build/Products/**/*.xcarchive

    publishing:
      email:
        recipients:
          - davideurso87@gmail.com
        notify:
          success: true
          failure: true
