workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic fAInance

    environment:
      groups:
        - appstore-connect

      node: latest
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.fainanceapp.app

      vars:
        BUNDLE_ID: "it.fainanceapp.app"
        WIDGET_BUNDLE_ID: "it.fainanceapp.app.widgets"
        APPLE_TEAM_ID: "SSV4P8694F"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.6.56"
        VITE_FIREBASE_API_KEY: "AIzaSyB6AQpz2MWphyc2RGmELZUfb2AUhzfi1To"
        VITE_FIREBASE_AUTH_DOMAIN: "fainance-a7794.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "fainance-a7794"
        VITE_FIREBASE_STORAGE_BUCKET: "fainance-a7794.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "739607555867"
        VITE_FIREBASE_APP_ID: "1:739607555867:android:16aa0add0a289fb3cd6dbe"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS platform
        script: |
          CAP_VERSION=$(node -p "const p=require('./package.json'); const v=(p.dependencies && p.dependencies['@capacitor/core']) || (p.devDependencies && p.devDependencies['@capacitor/core']) || 'latest'; console.log(v)")
          npm install @capacitor/ios@$CAP_VERSION

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods if Podfile exists
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd ../..
          elif [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "Nessun Podfile trovato. Continuo senza pod install."
          fi

      - name: Set iOS version, build number, privacy permissions and encryption compliance
        script: |
          cd ios/App

          IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          case "$IOS_BUILD_NUMBER" in
            *[!0-9]*|"") IOS_BUILD_NUMBER="1" ;;
          esac

          echo "Using iOS marketing version: $APP_VERSION"
          echo "Using iOS build number: $IOS_BUILD_NUMBER"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" App/Info.plist || true

          if [ -f "FainanceWidgets/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" FainanceWidgets/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" FainanceWidgets/Info.plist || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $WIDGET_BUNDLE_ID" FainanceWidgets/Info.plist || true
          fi

          perl -0pi -e "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $APP_VERSION;/g" App.xcodeproj/project.pbxproj || true
          perl -0pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $IOS_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj || true

          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string fAInance needs access to your photo library so you can select receipt images and import documents into the app." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription fAInance needs access to your photo library so you can select receipt images and import documents into the app." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string fAInance needs permission to save exported files or generated images to your photo library when you choose to do so." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription fAInance needs permission to save exported files or generated images to your photo library when you choose to do so." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string fAInance needs access to the camera so you can scan receipts and attach images to your transactions." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription fAInance needs access to the camera so you can scan receipts and attach images to your transactions." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string fAInance needs access to the microphone so you can add expenses and income using your voice." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription fAInance needs access to the microphone so you can add expenses and income using your voice." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string fAInance uses speech recognition to convert your voice commands into expense or income entries." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription fAInance uses speech recognition to convert your voice commands into expense or income entries." App/Info.plist

          xcrun agvtool new-marketing-version "$APP_VERSION" || true
          xcrun agvtool new-version -all "$IOS_BUILD_NUMBER" || true

          cat App/Info.plist

          cd ../..

      - name: Fetch iOS signing files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          python3 - <<'PY'
          import glob
          import os
          import plistlib
          import subprocess
          import sys

          team_id = os.environ.get("APPLE_TEAM_ID", "")
          targets = {
              os.environ["BUNDLE_ID"]: "APP",
              os.environ["WIDGET_BUNDLE_ID"]: "WIDGET",
          }
          found = {}

          for path in glob.glob(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision")):
              try:
                  raw = subprocess.check_output(["security", "cms", "-D", "-i", path])
                  profile = plistlib.loads(raw)
              except Exception:
                  continue

              entitlements = profile.get("Entitlements", {}) or {}
              application_identifier = str(entitlements.get("application-identifier", ""))
              bundle = application_identifier
              if team_id and bundle.startswith(team_id + "."):
                  bundle = bundle[len(team_id) + 1:]

              if bundle in targets:
                  key = targets[bundle]
                  found[key] = {
                      "bundle": bundle,
                      "name": profile.get("Name", ""),
                      "uuid": profile.get("UUID", ""),
                      "path": path,
                  }

          missing = [label for label in ("APP", "WIDGET") if label not in found]
          if missing:
              print("Provisioning profile mancanti per:", ", ".join(missing))
              print("Profili trovati:")
              for v in found.values():
                  print(v)
              sys.exit(1)

          with open(os.environ["CM_ENV"], "a", encoding="utf-8") as f:
              for key, value in found.items():
                  f.write(f"{key}_PROFILE_NAME={value['name']}\n")
                  f.write(f"{key}_PROFILE_UUID={value['uuid']}\n")

          print("Provisioning profile App:", found["APP"])
          print("Provisioning profile Widget:", found["WIDGET"])
          PY

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Patch App and Widget target signing
        script: |
          python3 - <<'PY'
          import os
          import re

          pbxproj = "ios/App/App.xcodeproj/project.pbxproj"
          team_id = os.environ["APPLE_TEAM_ID"]
          app_bundle_id = os.environ["BUNDLE_ID"]
          widget_bundle_id = os.environ["WIDGET_BUNDLE_ID"]
          app_profile = os.environ["APP_PROFILE_NAME"]
          widget_profile = os.environ["WIDGET_PROFILE_NAME"]

          with open(pbxproj, "r", encoding="utf-8") as f:
              text = f.read()

          def replace_or_add(block, key, value):
              pattern = rf"{key} = [^;]*;"
              line = f"                {key} = {value};"
              if re.search(pattern, block):
                  return re.sub(pattern, line.strip(), block)
              return block.replace("buildSettings = {", "buildSettings = {\n" + line, 1)

          pattern = r"buildSettings = \{[\s\S]*?\n\s*\};"
          blocks = list(re.finditer(pattern, text))
          replacements = []

          for match in blocks:
              block = match.group(0)
              if "PRODUCT_BUNDLE_IDENTIFIER" not in block:
                  continue

              if widget_bundle_id in block or "FainanceWidgets/Info.plist" in block:
                  bundle_id = widget_bundle_id
                  profile = widget_profile
              else:
                  bundle_id = app_bundle_id
                  profile = app_profile

              new_block = block
              new_block = replace_or_add(new_block, "DEVELOPMENT_TEAM", team_id)
              new_block = replace_or_add(new_block, "CODE_SIGN_STYLE", "Manual")
              new_block = replace_or_add(new_block, "CODE_SIGN_IDENTITY", '"Apple Distribution"')
              new_block = replace_or_add(new_block, "PROVISIONING_PROFILE_SPECIFIER", f'"{profile}"')
              new_block = replace_or_add(new_block, "PRODUCT_BUNDLE_IDENTIFIER", bundle_id)
              replacements.append((match.start(), match.end(), new_block))

          for start, end, replacement in reversed(replacements):
              text = text[:start] + replacement + text[end:]

          with open(pbxproj, "w", encoding="utf-8") as f:
              f.write(text)

          print("App and Widget target signing patched")
          PY

          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj | head -140

      - name: Create export options
        script: |
          cat > "$CM_BUILD_DIR/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${APP_PROFILE_NAME}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          cat "$CM_BUILD_DIR/export_options.plist"

      - name: Build iOS IPA
        script: |
          rm -rf "$CM_BUILD_DIR/build/ios"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration

      email:
        recipients:
          - davideurso87@gmail.com
        notify:
          success: false
          failure: true
