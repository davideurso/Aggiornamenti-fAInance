workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS platform
        script: |
          CAP_VERSION=$(node -p "const p=require('./package.json'); const v=(p.dependencies && p.dependencies['@capacitor/core']) || (p.devDependencies && p.devDependencies['@capacitor/core']) || 'latest'; console.log(v)")
          npm install @capacitor/ios@$CAP_VERSION

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Inspect iOS folder
        script: |
          echo "Contenuto cartella ios:"
          find ios -maxdepth 4 -type f | sort

      - name: Install CocoaPods if Podfile exists
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          elif [ -f "ios/Podfile" ]; then
            cd ios
            pod install
          else
            echo "Nessun Podfile trovato. Continuo senza pod install."
          fi

      - name: Build iOS simulator app
        script: |
          cd ios/App

          if [ -f "App.xcworkspace" ] || [ -d "App.xcworkspace" ]; then
            echo "Uso App.xcworkspace"
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build
          elif [ -d "App.xcodeproj" ]; then
            echo "Uso App.xcodeproj"
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build
          else
            echo "Né App.xcworkspace né App.xcodeproj trovati."
            echo "Contenuto ios/App:"
            ls -la
            exit 1
          fi

    artifacts:
      - ios/App/build/Build/Products/**/*.app
      - ios/App/build/Build/Products/**/*.ipa
      - ios/App/build/Build/Products/**/*.xcarchive

    publishing:
      email:
        recipients:
          - davideurso87@gmail.com
        notify:
          success: true
          failure: true
