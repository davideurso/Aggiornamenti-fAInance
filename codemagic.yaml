workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic fAInance

    environment:
      groups:
        - appstore-connect

      node: latest
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.fainanceapp.app

      vars:
        BUNDLE_ID: "it.fainanceapp.app"
        WIDGET_BUNDLE_ID: "it.fainanceapp.app.widgets"
        APPLE_TEAM_ID: "SSV4P8694F"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_VERSION: "1.6.72"
        IOS_BUILD_NUMBER: "219"
        EXPECTED_VERSION: "1.6.72"
        VITE_FIREBASE_API_KEY: "AIzaSyBub3sUOwWqQsutPMAGjK_GInzqgrKTUno"
        VITE_FIREBASE_AUTH_DOMAIN: "fainance-a7794.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "fainance-a7794"
        VITE_FIREBASE_STORAGE_BUCKET: "fainance-a7794.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "739607555867"
        VITE_FIREBASE_APP_ID: "1:739607555867:web:ae797cd0a578e476cd6dbe"
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor iOS platform
        script: |
          CAP_VERSION=$(node -p "const p=require('./package.json'); const v=(p.dependencies && p.dependencies['@capacitor/core']) || (p.devDependencies && p.devDependencies['@capacitor/core']) || 'latest'; console.log(v)")
          npm install @capacitor/ios@$CAP_VERSION

      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods if Podfile exists
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
            cd ../..
          elif [ -f "ios/Podfile" ]; then
            cd ios
            pod install
            cd ..
          else
            echo "Nessun Podfile trovato. Continuo senza pod install."
          fi

      - name: Set iOS version, build number, privacy permissions and encryption compliance
        script: |
          cd ios/App

          BUILD_NUMBER="$IOS_BUILD_NUMBER"
          echo "Using iOS marketing version: $APP_VERSION"
          echo "Using iOS build number: $BUILD_NUMBER"

          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: APP_VERSION=$APP_VERSION EXPECTED_VERSION=$EXPECTED_VERSION"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" App/Info.plist || true

          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string fAInance needs access to your photo library so you can select receipt images and import documents into the app." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription fAInance needs access to your photo library so you can select receipt images and import documents into the app." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string fAInance needs permission to save exported files or generated images to your photo library when you choose to do so." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription fAInance needs permission to save exported files or generated images to your photo library when you choose to do so." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string fAInance needs access to the camera so you can scan receipts and attach images to your transactions." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription fAInance needs access to the camera so you can scan receipts and attach images to your transactions." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string fAInance needs access to the microphone so you can add expenses and income using your voice." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription fAInance needs access to the microphone so you can add expenses and income using your voice." App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string fAInance uses speech recognition to convert your voice commands into expense or income entries." App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription fAInance uses speech recognition to convert your voice commands into expense or income entries." App/Info.plist

          xcrun agvtool new-marketing-version "$APP_VERSION" || true
          xcrun agvtool new-version -all "$BUILD_NUMBER" || true

          cat App/Info.plist

          cd ../..

      - name: Fetch iOS signing files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          APP_PROFILE_NAME=""
          WIDGET_PROFILE_NAME=""

          for candidate in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$candidate" ] || continue
            security cms -D -i "$candidate" > "$CM_BUILD_DIR/candidate-profile.plist"
            APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$CM_BUILD_DIR/candidate-profile.plist" 2>/dev/null || true)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$CM_BUILD_DIR/candidate-profile.plist" 2>/dev/null || true)

            if [ "$APP_IDENTIFIER" = "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
              APP_PROFILE_NAME="$PROFILE_NAME"
            elif [ "$APP_IDENTIFIER" = "${APPLE_TEAM_ID}.${WIDGET_BUNDLE_ID}" ]; then
              WIDGET_PROFILE_NAME="$PROFILE_NAME"
            fi
          done

          if [ -z "$APP_PROFILE_NAME" ]; then
            echo "Nessun profilo compatibile con ${BUNDLE_ID}."
            exit 1
          fi

          if [ -z "$WIDGET_PROFILE_NAME" ]; then
            echo "Nessun profilo compatibile con ${WIDGET_BUNDLE_ID}."
            exit 1
          fi

          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$CM_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$CM_ENV"

          echo "Profilo app: $APP_PROFILE_NAME"
          echo "Profilo widget: $WIDGET_PROFILE_NAME"

      - name: Configure signing for app and widget
        script: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pbxproj = Path("ios/App/App.xcodeproj/project.pbxproj")
          app_id = os.environ["BUNDLE_ID"]
          widget_id = os.environ["WIDGET_BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          app_profile = os.environ["APP_PROFILE_NAME"]
          widget_profile = os.environ["WIDGET_PROFILE_NAME"]

          text = pbxproj.read_text(encoding="utf-8")

          def set_value(block: str, key: str, value: str) -> str:
              pattern = rf"(^\s*){re.escape(key)} = [^;]*;"
              match = re.search(pattern, block, flags=re.MULTILINE)
              if match:
                  indent = match.group(1)
                  return re.sub(pattern, f"{indent}{key} = {value};", block, flags=re.MULTILINE)
              return block.replace("buildSettings = {", f"buildSettings = {{\n\t\t\t\t{key} = {value};", 1)

          def patch_block(match: re.Match) -> str:
              block = match.group(0)
              id_match = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", block)
              if not id_match:
                  return block

              bundle_id = id_match.group(1).strip().strip('"')
              if bundle_id == app_id:
                  profile = app_profile
              elif bundle_id == widget_id:
                  profile = widget_profile
              else:
                  return block

              block = set_value(block, "DEVELOPMENT_TEAM", team_id)
              block = set_value(block, "CODE_SIGN_STYLE", "Manual")
              block = set_value(block, "CODE_SIGN_IDENTITY", '"Apple Distribution"')
              block = set_value(block, "PROVISIONING_PROFILE_SPECIFIER", f'"{profile}"')
              return block

          text = re.sub(r"buildSettings = \{[\s\S]*?\n\s*\};", patch_block, text)
          pbxproj.write_text(text, encoding="utf-8")

          if f"PRODUCT_BUNDLE_IDENTIFIER = {app_id};" not in text:
              raise SystemExit("Bundle ID app mancante dopo la configurazione")
          if f"PRODUCT_BUNDLE_IDENTIFIER = {widget_id};" not in text:
              raise SystemExit("Bundle ID widget mancante dopo la configurazione")

          print("Firma configurata separatamente per app e widget")
          PY

          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj | head -120

      - name: Create export options
        script: |
          cat > "$CM_BUILD_DIR/export_options.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${APP_PROFILE_NAME}</string>
              <key>${WIDGET_BUNDLE_ID}</key>
              <string>${WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          cat "$CM_BUILD_DIR/export_options.plist"

      - name: Build iOS IPA
        script: |
          rm -rf "$CM_BUILD_DIR/build/ios"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            archive

          ARCHIVE_INFO="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive/Info.plist"
          ARCHIVED_APP_PLIST="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive/Products/Applications/App.app/Info.plist"

          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVED_APP_PLIST")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVED_APP_PLIST")
          echo "Archived iOS version: $ACTUAL_VERSION ($ACTUAL_BUILD)"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "ERROR: archived version is not $EXPECTED_VERSION ($IOS_BUILD_NUMBER)"
            exit 1
          fi

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Tester interni fAInance"

      email:
        recipients:
          - davideurso87@gmail.com
        notify:
          success: false
          failure: true