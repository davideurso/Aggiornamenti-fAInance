      - name: Fetch iOS signing files
        script: |
          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          APP_PROFILE_NAME=""
          WIDGET_PROFILE_NAME=""

          for candidate in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$candidate" ] || continue
            security cms -D -i "$candidate" > "$CM_BUILD_DIR/candidate-profile.plist"
            APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$CM_BUILD_DIR/candidate-profile.plist" 2>/dev/null || true)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$CM_BUILD_DIR/candidate-profile.plist" 2>/dev/null || true)

            if [ "$APP_IDENTIFIER" = "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]; then
              APP_PROFILE_NAME="$PROFILE_NAME"
            elif [ "$APP_IDENTIFIER" = "${APPLE_TEAM_ID}.${WIDGET_BUNDLE_ID}" ]; then
              WIDGET_PROFILE_NAME="$PROFILE_NAME"
            fi
          done

          if [ -z "$APP_PROFILE_NAME" ]; then
            echo "Nessun profilo compatibile con ${BUNDLE_ID}."
            exit 1
          fi

          if [ -z "$WIDGET_PROFILE_NAME" ]; then
            echo "Nessun profilo compatibile con ${WIDGET_BUNDLE_ID}."
            exit 1
          fi

          echo "APP_PROFILE_NAME=$APP_PROFILE_NAME" >> "$CM_ENV"
          echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> "$CM_ENV"

          echo "Profilo app: $APP_PROFILE_NAME"
          echo "Profilo widget: $WIDGET_PROFILE_NAME"

      - name: Configure signing for app and widget
        script: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pbxproj = Path("ios/App/App.xcodeproj/project.pbxproj")
          app_id = os.environ["BUNDLE_ID"]
          widget_id = os.environ["WIDGET_BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          app_profile = os.environ["APP_PROFILE_NAME"]
          widget_profile = os.environ["WIDGET_PROFILE_NAME"]

          text = pbxproj.read_text(encoding="utf-8")

          def set_value(block: str, key: str, value: str) -> str:
              pattern = rf"(^\s*){re.escape(key)} = [^;]*;"
              match = re.search(pattern, block, flags=re.MULTILINE)
              if match:
                  indent = match.group(1)
                  return re.sub(pattern, f"{indent}{key} = {value};", block, flags=re.MULTILINE)
              return block.replace("buildSettings = {", f"buildSettings = {{\n\t\t\t\t{key} = {value};", 1)

          def patch_block(match: re.Match) -> str:
              block = match.group(0)
              id_match = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", block)
              if not id_match:
                  return block

              bundle_id = id_match.group(1).strip().strip('"')
              if bundle_id == app_id:
                  profile = app_profile
              elif bundle_id == widget_id:
                  profile = widget_profile
              else:
                  return block

              block = set_value(block, "DEVELOPMENT_TEAM", team_id)
              block = set_value(block, "CODE_SIGN_STYLE", "Manual")
              block = set_value(block, "CODE_SIGN_IDENTITY", '"Apple Distribution"')
              block = set_value(block, "PROVISIONING_PROFILE_SPECIFIER", f'"{profile}"')
              return block

          text = re.sub(r"buildSettings = \{[\s\S]*?\n\s*\};", patch_block, text)
          pbxproj.write_text(text, encoding="utf-8")

          if f"PRODUCT_BUNDLE_IDENTIFIER = {app_id};" not in text:
              raise SystemExit("Bundle ID app mancante dopo la configurazione")
          if f"PRODUCT_BUNDLE_IDENTIFIER = {widget_id};" not in text:
              raise SystemExit("Bundle ID widget mancante dopo la configurazione")

          print("Firma configurata separatamente per app e widget")
          PY

