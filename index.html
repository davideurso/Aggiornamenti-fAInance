<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Tracker Spese</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #f7f7f7; }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script id="fainance-boot-fallback">
      setTimeout(function(){
        var root=document.getElementById('root');
        if(root && !root.childNodes.length){
          root.innerHTML='<div style="min-height:100vh;background:#f7f7f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:24px;display:flex;align-items:center;justify-content:center;"><div style="max-width:420px;background:white;border:1px solid #eee;border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.08);"><div style="font-size:18px;font-weight:800;margin-bottom:8px;color:#b00020;">Avvio non completato</div><div style="font-size:13px;line-height:1.45;color:#555;">Il bundle JavaScript non è partito. Controllare asset Vite/Capacitor nella build iOS.</div></div></div>';
        }
      },7000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
